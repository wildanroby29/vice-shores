<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vice Shores — 3D open-world crime</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1e; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    /* Read aloud, never shown: the status line screen readers announce. */
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Vice Shores: a 3D open-world crime game. Drive, steal cars, outrun the police, run jobs for Marla."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="./vendor/three.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
